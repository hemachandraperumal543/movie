# ─────────────────────────────────────────────
#  WatchWise — Application Properties
#  Local: uses defaults | Railway: uses env vars
# ─────────────────────────────────────────────

# Server port — Railway injects $PORT automatically
server.port=${PORT:8080}

# ── MySQL Database ──
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3308}/${MYSQLDATABASE:watchwise_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── Static Resources (serves nd.html as the frontend) ──
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
